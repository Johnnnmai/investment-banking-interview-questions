<script>/* UTM passthrough: copy visitor utm_source onto Gumroad links */(function(){function r(){var s=new URLSearchParams(location.search).get("utm_source");if(!s)return;var links=document.getElementsByTagName("a");for(var i=0;i<links.length;i++){var a=links[i];try{var u=new URL(a.href,location.href);var h=u.hostname.toLowerCase();if(h==="gumroad.com"||h.slice(-13)===".gumroad.com"){u.searchParams.set("utm_source",s);a.href=u.toString();}}catch(e){}}}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",r);}else{r();}})();</script>
