<!DOCTYPE html>
<html lang="en"{% if site.qpage_cta.url contains 'EARLYBF' %} data-offer-until="{{ site.qpage_cta.offer_expires }}"{% endif %}>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ site.qpage_site }}{{ page.url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ site.qpage_site }}{{ page.url }}">
    <meta property="og:image" content="{{ site.qpage_site }}/assets/playbook-og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    {% if page.faq_jsonld %}<script type="application/ld+json">{{ page.faq_jsonld }}</script>{% endif %}
    {% include vp-icons.html %}
    {% include head-custom.html %}
  </head>
  <body>
{% include vp-nav.html %}
{{ content }}
{% include sticky-cta.html campaign=page.slug %}
{% include vp-foot.html %}
  </body>
</html>
