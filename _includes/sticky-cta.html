{%- comment -%} Sticky bottom bar for the free Top 30; shown by the script in vp-foot.html after the hero scrolls away. Params: campaign, medium, source. {%- endcomment -%}
<div class=sticky-cta role=complementary aria-label="Get the free IB Top 30" aria-hidden=true><span class=t><b><span class=full>{{ site.free_cta.product_name }}</span><span class=short>IB {{ site.free_cta.product_short }}</span></b><span class=long> &middot; free guide</span><span class=short> &middot; free</span></span><a class=btn href="{% include buy-url.html kind='free' campaign=include.campaign content='sticky_bar' medium=include.medium source=include.source %}">Get it free &rarr;</a></div>
