{%- comment -%} Above-the-fold buy button. Params: campaign, ghost_href, ghost_text, medium, source. {%- endcomment -%}
<div class="acts"><a class="btn btn-primary" href="{% include buy-url.html campaign=include.campaign content='hero' medium=include.medium source=include.source %}">{{ site.qpage_cta.button }} <span class=dot aria-hidden=true>&rarr;</span></a><a class="btn btn-ghost" href="{{ include.ghost_href }}">{{ include.ghost_text }}</a></div><p class="price-line"><span><span class="num">{{ site.qpage_cta.price }}</span> on Gumroad, instant download</span>{% include promo.html %}</p>
